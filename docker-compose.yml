# Local development stack. Run it through the Makefile (`make up`).
# Everything is configured from .env (copy of .env.example, git-ignored).

x-php: &php
  build:
    context: docker/php
  image: slax-php-dev
  user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
  env_file: .env
  environment:
    # Also for .env files created before this setting existed (see .env.example).
    REVERB_MAX_REQUEST_SIZE: "${REVERB_MAX_REQUEST_SIZE:-131072}"
  working_dir: /var/www/html
  volumes:
    - ./backend:/var/www/html
    # Same file as env_file: Laravel/dotenv expects to find .env next to artisan.
    - ./.env:/var/www/html/.env:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # Laravel under PHP-FPM, reached through `web`.
  app:
    <<: *php

  # WebSocket server (Laravel Reverb), reached through `web` at /app.
  reverb:
    <<: *php
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  queue:
    <<: *php
    command: php artisan queue:listen --tries=3

  scheduler:
    <<: *php
    command: php artisan schedule:work

  # Single entry point for the browser: http://localhost:8080
  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/laravel-fastcgi.conf:/etc/nginx/laravel-fastcgi.conf:ro
    depends_on:
      - app
      - reverb
      - frontend

  # Vite dev server (hot reload), proxied by `web`.
  frontend:
    image: node:24-alpine
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      HMR_CLIENT_PORT: "${WEB_PORT:-8080}"
    volumes:
      - ./frontend:/app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${DB_DATABASE}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage. MinIO's Docker Hub images are gone, hence
  # Chainguard's rebuild. Console: http://localhost:9001
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${AWS_ACCESS_KEY_ID}"
      MINIO_ROOT_PASSWORD: "${AWS_SECRET_ACCESS_KEY}"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  # One-shot: creates the bucket (retries until MinIO is up, then exits).
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    restart: on-failure
    environment:
      MC_HOST_local: "http://${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}@minio:9000"
    command: ["mb", "--ignore-existing", "local/${AWS_BUCKET}"]
    depends_on:
      - minio

  # Tooling container for services/scanner (pytest, ruff); not started by `up`.
  python-tools:
    profiles: ["tools"]
    build:
      context: docker/python
    image: slax-python-dev
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
    volumes:
      - ./services/scanner:/app

volumes:
  postgres-data:
  redis-data:
  minio-data:
