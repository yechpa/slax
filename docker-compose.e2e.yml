# End-to-end stack, layered on docker-compose.yml by `make e2e`:
#
#   docker compose -p slax-e2e --env-file e2e/stack.env -f docker-compose.yml -f docker-compose.e2e.yml
#
# A separate Compose project (its own containers, network and volumes, so a fresh database
# each run and never the development data), configured from e2e/stack.env only (never the
# developer's .env), with APP_ENV=e2e. Nothing is published on the host: Playwright runs in
# its own container on the web container's network and reaches the app at http://localhost.

services:
  app:
    env_file: !override
      - e2e/stack.env
    environment:
      APP_KEY: "${APP_KEY:-}"  # generated by make e2e on each run
    volumes: !override
      - ./backend:/var/www/html
      # No .env file in the container: everything comes from e2e/stack.env.
      - /dev/null:/var/www/html/.env:ro

  reverb:
    env_file: !override
      - e2e/stack.env
    environment:
      APP_KEY: "${APP_KEY:-}"  # generated by make e2e on each run
    volumes: !override
      - ./backend:/var/www/html
      - /dev/null:/var/www/html/.env:ro

  queue:
    env_file: !override
      - e2e/stack.env
    environment:
      APP_KEY: "${APP_KEY:-}"  # generated by make e2e on each run
    volumes: !override
      - ./backend:/var/www/html
      - /dev/null:/var/www/html/.env:ro
    # Broadcasts and channel revocations go through the queue: one worker keeps their order.
    command: php artisan queue:work --tries=3 --sleep=0

  # Not part of the e2e stack.
  scheduler:
    profiles: ["dev"]

  # Only used to build the e2e bundle (`vite build --mode e2e`), never served.
  frontend:
    profiles: ["dev"]

  web:
    ports: !reset []
    volumes: !override
      - ./docker/nginx/e2e.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/laravel-fastcgi.conf:/etc/nginx/laravel-fastcgi.conf:ro
      - ./frontend/dist-e2e:/srv/spa:ro
    depends_on: !override
      - app
      - reverb

  minio:
    ports: !reset []

  # The Playwright runner (official image: the browsers come with it, the host needs none).
  playwright:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    network_mode: "service:web"
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    init: true
    shm_size: "1gb"
    working_dir: /repo/e2e
    environment:
      HOME: /tmp
      CI: "${CI:-}"
      # 1: also write the reference screenshots to docs/design/e2e (rtl.spec.ts).
      E2E_SCREENSHOTS: "${E2E_SCREENSHOTS:-}"
      npm_config_cache: /tmp/npm
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - ./e2e:/repo/e2e
      # The app's translations, to assert the exact strings each language shows.
      - ./frontend/src/i18n:/repo/frontend/src/i18n:ro
      # Reference screenshots for review (rtl.spec.ts).
      - ./docs/design/e2e:/repo/docs/design/e2e
    command: ["sh", "-c", "npm ci --no-audit --no-fund --silent && npx tsc --noEmit && npx playwright test"]
