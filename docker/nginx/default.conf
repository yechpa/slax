# Dev reverse proxy: one origin (http://localhost:8080) for SPA, API and WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    # Laravel (PHP-FPM)
    location ~ ^/(api|auth|sanctum|broadcasting)/ { include /etc/nginx/laravel-fastcgi.conf; }
    location = /up { include /etc/nginx/laravel-fastcgi.conf; }

    # Reverb WebSocket server
    location ~ ^/apps?/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Everything else: Vite dev server (including its HMR WebSocket)
    location / {
        resolver 127.0.0.11 valid=5s;
        set $vite http://frontend:5173;
        proxy_pass $vite;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
