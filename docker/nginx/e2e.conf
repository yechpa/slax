# End-to-end proxy (`make e2e`): same routes as default.conf, but the SPA is the built
# end-to-end bundle (frontend/dist-e2e) served as static files instead of the Vite dev server.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    # Laravel (PHP-FPM)
    location ~ ^/(api|auth|sanctum|broadcasting)/ { include /etc/nginx/laravel-fastcgi.conf; }
    location = /up { include /etc/nginx/laravel-fastcgi.conf; }

    # Reverb WebSocket server
    location ~ ^/apps?/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # The PWA, served as in production (docker/web/slax.conf.template).
    location = /sw.js {
        root /srv/spa;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        root /srv/spa;
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # The SPA: files from the build, every other path is the app's own route.
    location / {
        root /srv/spa;
        try_files $uri /index.html;
    }
}
