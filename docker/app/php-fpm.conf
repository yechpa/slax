; PHP-FPM for production (replaces the image's www.conf, docker.conf and zz-docker.conf).
; Reached only by nginx in the same pod: it listens on the loopback interface, never on
; the pod's network (FastCGI has no authentication).

[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1

; A small node: a few workers, recycled now and then.
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
request_terminate_timeout = 65s

; Liveness check (cgi-fcgi, see the Dockerfile's HEALTHCHECK and the Helm chart).
ping.path = /fpm-ping
ping.response = pong

; Laravel reads its configuration from the environment.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
