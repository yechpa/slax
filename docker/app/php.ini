; Production settings, on top of php.ini-production (docker/app/Dockerfile).
expose_php = Off
memory_limit = 256M
date.timezone = UTC
max_execution_time = 60

; Uploads: the API refuses files over 10 MB itself; PHP lets slightly more through so it can.
upload_max_filesize = 11M
post_max_size = 12M

; Logs go to the container's stderr (php.ini-production leaves error_log unset: stderr).
display_errors = Off
display_startup_errors = Off
log_errors = On

; The code never changes inside a running container.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 96
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
