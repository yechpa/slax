# nginx for the slax-web image: unprivileged (port 8080), everything it writes under /tmp,
# logs to stdout/stderr. The site itself is rendered at start (entrypoint.sh) into
# /tmp/nginx/conf.d from /etc/nginx/slax/slax.conf.template.
worker_processes 2;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    # The path without its query string: the sign-in callback's ?code=&state= stays out of logs.
    log_format slax '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time "$http_user_agent"';
    # Kubernetes probes are not logged.
    map $http_user_agent $slax_loggable {
        ~^kube-probe/ 0;
        default 1;
    }
    access_log /dev/stdout slax if=$slax_loggable;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /tmp/nginx/conf.d/*.conf;
}
