{{- if .Values.minio.enabled }}
{{- $component := "minio" -}}
{{- $name := include "slax.name" (dict "ctx" . "component" $component) -}}
# Development only: S3-compatible storage in the cluster (production uses real S3).
# Root credentials are the app's S3 keys from the Secret. Browsers reach it on its own host
# (files ingress); the console (port 9001) is not exposed: kubectl port-forward.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "slax.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "slax.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      # Selector labels only: no image tag or chart version, so a deployment of new app
      # images does not restart the database.
      labels:
        {{- include "slax.selectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- include "slax.podCommon" . | nindent 6 }}
      securityContext:
        {{- include "slax.podSecurityContext" 65532 | nindent 8 }}
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--address", ":9000", "--console-address", ":9001", "--certs-dir", "/tmp/certs"]
          env:
            - name: HOME
              value: /tmp
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: AWS_ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: AWS_SECRET_ACCESS_KEY
            - name: MINIO_BROWSER_REDIRECT
              value: "false"
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          securityContext:
            {{- include "slax.containerSecurityContext" 65532 | nindent 12 }}
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "slax.selectorLabels" (dict "ctx" . "component" $component) | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.minio.storage.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.minio.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "slax.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "slax.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
{{- $setup := "minio-setup" }}
# Creates the bucket and keeps it private (files are only reached through presigned URLs).
# After each install/upgrade, once MinIO is up; idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "slax.name" (dict "ctx" . "component" $setup) }}
  labels:
    {{- include "slax.componentLabels" (dict "ctx" . "component" $setup) | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "slax.componentLabels" (dict "ctx" . "component" $setup) | nindent 8 }}
    spec:
      {{- include "slax.podCommon" . | nindent 6 }}
      restartPolicy: OnFailure
      securityContext:
        {{- include "slax.podSecurityContext" 65532 | nindent 8 }}
      initContainers:
        - name: create-bucket
          image: {{ .Values.minio.clientImage }}
          args: ["--config-dir", "/tmp/mc", "mb", "--ignore-existing", "local/{{ .Values.s3.bucket }}"]
          env:
            - name: HOME
              value: /tmp
            - name: MC_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: AWS_ACCESS_KEY_ID
            - name: MC_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: AWS_SECRET_ACCESS_KEY
            # Kubernetes expands $(VAR) from the variables above. Keys must be URL-safe
            # (BOOTSTRAP.md generates hexadecimal ones).
            - name: MC_HOST_local
              value: "http://$(MC_ACCESS_KEY):$(MC_SECRET_KEY)@{{ $name }}:9000"
          securityContext:
            {{- include "slax.containerSecurityContext" 65532 | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: make-private
          image: {{ .Values.minio.clientImage }}
          args: ["--config-dir", "/tmp/mc", "anonymous", "set", "none", "local/{{ .Values.s3.bucket }}"]
          env:
            - name: HOME
              value: /tmp
            - name: MC_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: AWS_ACCESS_KEY_ID
            - name: MC_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: AWS_SECRET_ACCESS_KEY
            # Kubernetes expands $(VAR) from the variables above. Keys must be URL-safe
            # (BOOTSTRAP.md generates hexadecimal ones).
            - name: MC_HOST_local
              value: "http://$(MC_ACCESS_KEY):$(MC_SECRET_KEY)@{{ $name }}:9000"
          securityContext:
            {{- include "slax.containerSecurityContext" 65532 | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
{{- end }}
