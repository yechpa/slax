{{- if .Values.networkPolicy.enabled }}
{{- $ctx := . }}
{{- $ic := .Values.networkPolicy.ingressController }}
# Nothing reaches a Slax pod unless a policy below lets it (k3s enforces network policies
# with its embedded kube-router). Kubelet probes from the node are always allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "slax.name" (dict "ctx" . "component" "default-deny") }}
  labels:
    {{- include "slax.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: slax
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Ingress"]
---
# The web pod: from the ingress controller only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "slax.name" (dict "ctx" . "component" "app") }}
  labels:
    {{- include "slax.componentLabels" (dict "ctx" . "component" "app") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "slax.selectorLabels" (dict "ctx" . "component" "app") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ic.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $ic.podLabels | nindent 14 }}
      ports:
        - port: 8080
          protocol: TCP
---
# Reverb: the WebSocket through the web pod's nginx, and its HTTP API (/apps/) from the
# Laravel processes. Nobody else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "slax.name" (dict "ctx" . "component" "reverb") }}
  labels:
    {{- include "slax.componentLabels" (dict "ctx" . "component" "reverb") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "slax.selectorLabels" (dict "ctx" . "component" "reverb") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- range list "app" "queue" "scheduler" }}
        - podSelector:
            matchLabels:
              {{- include "slax.selectorLabels" (dict "ctx" $ctx "component" .) | nindent 14 }}
        {{- end }}
      ports:
        - port: 8080
          protocol: TCP
---
# Upload scanner: only the app and queue pods may call it, and it calls nothing (no egress,
# not even DNS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "slax.name" (dict "ctx" . "component" "scanner") }}
  labels:
    {{- include "slax.componentLabels" (dict "ctx" . "component" "scanner") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "slax.selectorLabels" (dict "ctx" . "component" "scanner") | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        {{- range list "app" "queue" }}
        - podSelector:
            matchLabels:
              {{- include "slax.selectorLabels" (dict "ctx" $ctx "component" .) | nindent 14 }}
        {{- end }}
      ports:
        - port: 8000
          protocol: TCP
  egress: []
{{- range $component, $port := dict "postgres" 5432 "redis" 6379 }}
---
# {{ $component }}: from the Laravel processes (app, queue, scheduler, migrations){{ if eq $component "redis" }} and Reverb{{ end }}.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "slax.name" (dict "ctx" $ctx "component" $component) }}
  labels:
    {{- include "slax.componentLabels" (dict "ctx" $ctx "component" $component) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "slax.selectorLabels" (dict "ctx" $ctx "component" $component) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $ctx.Release.Name }}
              {{- include "slax.backendLabel" $ctx | nindent 14 }}
        {{- if eq $component "redis" }}
        - podSelector:
            matchLabels:
              {{- include "slax.selectorLabels" (dict "ctx" $ctx "component" "reverb") | nindent 14 }}
        {{- end }}
      ports:
        - port: {{ $port }}
          protocol: TCP
{{- end }}
{{- if .Values.minio.enabled }}
---
# MinIO (development): the Laravel processes, the bucket setup Job, and browsers through the
# ingress controller (presigned downloads).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "slax.name" (dict "ctx" . "component" "minio") }}
  labels:
    {{- include "slax.componentLabels" (dict "ctx" . "component" "minio") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "slax.selectorLabels" (dict "ctx" . "component" "minio") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              {{- include "slax.backendLabel" . | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "slax.selectorLabels" (dict "ctx" . "component" "minio-setup") | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ic.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $ic.podLabels | nindent 14 }}
      ports:
        - port: 9000
          protocol: TCP
{{- end }}
{{- end }}
