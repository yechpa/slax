name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Third-party actions are pinned by full commit SHA (the tag in the comment), runners by version,
# as in the other workflows.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pint, ESLint, Ruff
        run: make lint

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pest, Vitest, pytest
        run: make test

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Compose files need Compose >= 2.24.4 (!override, !reset); logged for diagnosis.
      - name: Docker and Compose versions
        run: docker version --format 'Docker {{.Server.Version}}' && docker compose version
      - name: Playwright on a fresh Compose stack (APP_ENV=e2e)
        run: make e2e
      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Helm chart: lint, dev/prod renders against the Kubernetes schemas, the chart's own rules.
  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: helm lint, kubeconform, chart rules
        run: make chart-lint

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
