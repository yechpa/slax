# Production images: ghcr.io/yechpa/slax-{app,web,scanner,backup} (backup: the production
# database backup CronJobs, deploy/backup/).
#
# Pull request: build and scan only (no registry login, nothing pushed, read-only token).
#
# Push to main: each image is built natively on each architecture (GitHub's arm64 runners are
# free for public repositories: no QEMU emulation) and scanned with Trivy; only then the
# `push` jobs push <sha>-amd64 / <sha>-arm64 with SBOM and provenance attestations, and the
# `manifest` jobs join them into the multi-architecture image <sha> (and move `latest`). The
# Helm chart deploys <sha> (deploy-dev.yml follows this workflow's success on main). An image
# that already exists is never pushed again: if <sha> exists (a re-run), nothing is rebuilt;
# an existing <sha>-<arch> is not re-pushed.
#
# Version tag v*: nothing is built. The tag job checks that main's run already published
# <sha> for the tagged commit (it fails otherwise: wait for that run, then re-run this one)
# and adds the version as one more name for that same manifest. Production deploys the
# immutable <sha> (Task 13's release workflow: --set image.tag=$GITHUB_SHA on the tag's
# commit); the version tag is a readable alias of exactly what was tested on dev.
#
# Third-party actions are pinned by full commit SHA (resolved from the tags in the trailing
# comments with `git ls-remote`); Trivy runs from its image pinned by digest.
name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - backend/**
      - frontend/**
      - services/scanner/**
      - docker/**
      - deploy/backup/*.sh
      - .github/workflows/images.yml

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: ghcr.io/yechpa/slax
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  # On main: has a previous run already published <sha> for all three images?
  published:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      all: ${{ steps.check.outputs.all }}
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: check
        run: |
          all=true
          for image in app web scanner backup; do
            if docker buildx imagetools inspect "$IMAGE_PREFIX-$image:$GITHUB_SHA" >/dev/null 2>&1; then
              echo "$IMAGE_PREFIX-$image:$GITHUB_SHA already published"
            else
              all=false
            fi
          done
          echo "all=$all" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.image }} (${{ matrix.arch }})
    needs: published
    # Pull requests, and main unless <sha> is already published. Never on version tags.
    if: >-
      !cancelled()
      && (github.event_name == 'pull_request'
          || (github.ref == 'refs/heads/main' && needs.published.result == 'success' && needs.published.outputs.all != 'true'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [app, web, scanner, backup]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: app
            context: .
            file: docker/app/Dockerfile
            target: runtime
          - image: web
            context: .
            file: docker/web/Dockerfile
            target: runtime
          - image: scanner
            context: services/scanner
            file: services/scanner/Dockerfile
            target: runtime
          - image: backup
            context: .
            file: docker/backup/Dockerfile
            target: runtime
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: slax-${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Size
        run: docker image ls "slax-$IMAGE:scan" --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      # Fails on CRITICAL vulnerabilities that have a fix (unfixed ones cannot be acted on).
      - name: Trivy (CRITICAL, fixable)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --no-progress --scanners vuln \
            --severity CRITICAL --ignore-unfixed --exit-code 1 \
            "slax-$IMAGE:scan"

      # The web image's routes and headers (CSP, Referrer-Policy kept from the API, /apps/ closed).
      - name: Web server checks
        if: matrix.image == 'web'
        run: docker/web/check.sh "slax-web:scan"

  # Main only, after every build and scan passed: the same build (from the cache), pushed with
  # its SBOM and provenance, unless that <sha>-<arch> already exists.
  push:
    name: push ${{ matrix.image }} (${{ matrix.arch }})
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [app, web, scanner, backup]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: app
            context: .
            file: docker/app/Dockerfile
            target: runtime
          - image: web
            context: .
            file: docker/web/Dockerfile
            target: runtime
          - image: scanner
            context: services/scanner
            file: services/scanner/Dockerfile
            target: runtime
          - image: backup
            context: .
            file: docker/backup/Dockerfile
            target: runtime
    env:
      REF: ghcr.io/yechpa/slax-${{ matrix.image }}:${{ github.sha }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: exists
        run: |
          if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            echo "$REF already exists: not pushed again."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.REF }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=slax-${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}

  manifest:
    name: manifest ${{ matrix.image }}
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [app, web, scanner, backup]
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join amd64 and arm64 into ${{ matrix.image }}:<sha> (and latest)
        run: |
          set -euo pipefail
          base="$IMAGE_PREFIX-$IMAGE"
          if docker buildx imagetools inspect "$base:$GITHUB_SHA" >/dev/null 2>&1; then
            echo "$base:$GITHUB_SHA already exists: not recreated."
            exit 0
          fi
          docker buildx imagetools create --tag "$base:$GITHUB_SHA" --tag "$base:latest" \
            "$base:$GITHUB_SHA-amd64" "$base:$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$base:$GITHUB_SHA"

  # Version tag: no build. The tagged commit's images must already be published by main's run.
  release-tag:
    name: tag ${{ github.ref_name }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check that <sha> is published for every image
        run: |
          set -euo pipefail
          missing=0
          for image in app web scanner backup; do
            ref="$IMAGE_PREFIX-$image:$GITHUB_SHA"
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "found $ref"
            else
              echo "::error::$ref does not exist. The Images run for this commit on main has not finished, or failed: wait for it (or fix it), then re-run this job."
              missing=1
            fi
          done
          exit "$missing"

      # The same manifest (and its attestations) under one more name: no new image.
      - name: Name it ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for image in app web scanner backup; do
            base="$IMAGE_PREFIX-$image"
            docker buildx imagetools create --tag "$base:$GITHUB_REF_NAME" "$base:$GITHUB_SHA"
            echo "$base:$GITHUB_REF_NAME -> $(docker buildx imagetools inspect "$base:$GITHUB_SHA" --format '{{json .Manifest.Digest}}')"
          done
