# Production images: ghcr.io/yechpa/slax-{app,web,scanner}.
#
# Each image is built natively on each architecture (GitHub's arm64 runners are free for
# public repositories: no QEMU emulation), scanned with Trivy, and, on main and on version
# tags only, pushed as <sha>-amd64 / <sha>-arm64 with SBOM and provenance attestations. The
# `manifest` job then joins both into the multi-architecture image <sha> (plus `latest` on
# main and the version on a tag), which the Helm chart deploys (deploy-dev.yml follows this
# workflow's success on main).
#
# Pull requests (forks included) build and scan only: no registry login, nothing pushed.
#
# Third-party actions are pinned by full commit SHA (resolved from the tags in the trailing
# comments with `git ls-remote`); Trivy runs from its image pinned by digest.
name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - backend/**
      - frontend/**
      - services/scanner/**
      - docker/**
      - .github/workflows/images.yml

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: ghcr.io/yechpa/slax
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  build:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # push on main and tags only (the login step is skipped otherwise)
    strategy:
      fail-fast: false
      matrix:
        image: [app, web, scanner]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: app
            context: .
            file: docker/app/Dockerfile
            target: runtime
          - image: web
            context: .
            file: docker/web/Dockerfile
            target: runtime
          - image: scanner
            context: services/scanner
            file: services/scanner/Dockerfile
            target: runtime
    env:
      IMAGE: ${{ matrix.image }}
      ARCH: ${{ matrix.arch }}
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built and loaded locally first, so nothing is pushed before the scan passes.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: slax-${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Size
        run: docker image ls "slax-$IMAGE:scan" --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      # Fails on CRITICAL vulnerabilities that have a fix (unfixed ones cannot be acted on).
      - name: Trivy (CRITICAL, fixable)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --no-progress --scanners vuln \
            --severity CRITICAL --ignore-unfixed --exit-code 1 \
            "slax-$IMAGE:scan"

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build (from the cache), pushed with its SBOM and provenance.
      - name: Push ${{ matrix.image }}:<sha>-${{ matrix.arch }}
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=slax-${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}

  manifest:
    name: ${{ matrix.image }} (multi-arch)
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [app, web, scanner]
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join amd64 and arm64 into ${{ matrix.image }}:<sha>
        run: |
          set -euo pipefail
          base="$IMAGE_PREFIX-$IMAGE"
          tags=(--tag "$base:$GITHUB_SHA")
          if [ "$GITHUB_REF" = refs/heads/main ]; then tags+=(--tag "$base:latest"); fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags+=(--tag "$base:$GITHUB_REF_NAME"); fi
          docker buildx imagetools create "${tags[@]}" "$base:$GITHUB_SHA-amd64" "$base:$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$base:$GITHUB_SHA"
